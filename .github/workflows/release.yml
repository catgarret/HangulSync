name: Release

# v로 시작하는 태그가 푸시되면 자동으로 빌드 → zip → 릴리즈 등록 (노트 자동 작성)
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Validate release tag
        shell: bash
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Release tag must match vMAJOR.MINOR.PATCH"
            exit 1
          fi

      - name: Test
        run: swift test

      - name: Build app
        run: |
          chmod +x build.sh
          ./build.sh

      - name: Package zip
        run: |
          cd build
          ditto -c -k --sequesterRsrc --keepParent HangulSync.app "HangulSync-${GITHUB_REF_NAME#v}.zip"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "HangulSync ${{ github.ref_name }}"
          files: build/HangulSync-*.zip
          body_path: ".github/release-notes/${{ github.ref_name }}.md"
          generate_release_notes: true
