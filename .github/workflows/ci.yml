name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-test:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v5
      - name: Build
        run: swift build
      - name: Test
        run: swift test
      - name: Install ShellCheck
        run: brew install shellcheck
      - name: ShellCheck
        run: shellcheck build.sh deploy.sh doctor.sh install.sh
